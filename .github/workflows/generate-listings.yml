name: Generate listings

on:
  issues:
    types:
      - opened
      - edited
      - closed
      - reopened

  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: generate-listings
  cancel-in-progress: false

jobs:
  generate-listings:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Pull latest master
        run: |
          git pull --rebase origin master

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate listings.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run generate:listings

      - name: Commit listings.json and sitemap.xml if changed
        run: |
          if [ -z "$(git status --porcelain public/data/listings.json public/sitemap.xml)" ]; then
            echo "No changes in public/data/listings.json or public/sitemap.xml"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add public/data/listings.json public/sitemap.xml
          git commit -m "Update listings.json and sitemap.xml"

          for i in 1 2 3; do
            echo "Push attempt $i"

            git pull --rebase origin master

            if git push origin master; then
              echo "Push successful"
              exit 0
            fi

            echo "Push failed, retrying in 3 seconds..."
            sleep 3
          done

          echo "Push failed after 3 attempts"
          exit 1