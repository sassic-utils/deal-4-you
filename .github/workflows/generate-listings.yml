name: Generate listings

on:
  issues:
    types:
      - opened
      - edited
      - closed
      - reopened
      - labeled
      - unlabeled

  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  generate-listings:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Generate listings.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run generate:listings

      - name: Commit listings.json if changed
        run: |
          if git diff --quiet public/data/listings.json; then
            echo "No changes in public/data/listings.json"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/data/listings.json
            git commit -m "Update listings.json"
            git push
          fi